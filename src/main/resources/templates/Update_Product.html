<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<title>Update Product - FoodFrenzy</title>
	<link rel="icon" type="image/x-icon" th:href="@{/Images/logo.png}">
	<link rel="stylesheet" th:href="@{/css/Update_Product.css}" />
</head>

<body>
	<a th:href="@{/admin/services}">Back to Services</a>
	<div class="updateProduct">
		<h3 style="font-weight: bolder;color: seagreen;">UPDATE EXISTING PRODUCT :</h3>
		<form action="" th:action="@{'/updatingProduct/'+${product.pid}}" th:object="${product}" method="post">
			<input type="hidden" name="pid" th:value="${product.pid}" /><br />
			Product_Name :
			<input type="text" name="pname" th:value="${product.pname}" required /> <br />
			Product_Price :
			<input type="number" step="0.01" name="pprice" th:value="${product.pprice}" required /><br />
			Product_Desc : <br />
			<textarea name="pdescription" th:text="${product.pdescription}" cols="25" rows="3" placeholder="Enter Product Description.."></textarea><br />
			<button type="submit">Update_Product</button>
		</form>
	</div>
</body>

</html>
