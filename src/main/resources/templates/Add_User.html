<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<title>Add User - FoodFrenzy</title>
	<link rel="icon" type="image/x-icon" th:href="@{/Images/logo.png}">
	<link rel="stylesheet" th:href="@{/css/Add_User.css}" />
</head>

<body>
	<a th:href="@{/admin/services}">Back to Services</a>
	<div class="addUser">
		<h3 style="color: red;">ADD NEW USER/CUSTOMER</h3>
		<form action="" th:action="@{/addingUser}" method="post">
			<label for="uname">User_Name :</label>
			<input type="text" id="uname" name="uname" required />
			<label for="uemail">User_Email :</label>
			<input type="email" id="uemail" name="uemail" required />
			<label for="unumber">User_Number :</label>
			<input type="tel" id="unumber" name="unumber" pattern="[0-9]{10}" placeholder="10-digit number" required />
			<input type="hidden" name="upassword" value="2330" />
			<button type="submit">Add_User</button>
		</form>
	</div>
</body>

</html>
