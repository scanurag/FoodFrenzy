<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFrenzy</title>
    <link rel="stylesheet" th:href="@{/css/Navigation.css}">
    <link rel="stylesheet" th:href="@{/css/Home.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <nav th:fragment="navbar()">
        <a th:href="@{/home}"><img th:src="@{/Images/logo.png}" alt="Logo" class="logo"></a>
        <ul>
            <li><a th:href="@{/home}">Home</a></li>
            <li><a th:href="@{/products}">Products</a></li>
            <li><a th:href="@{/location}">Locate Us</a></li>
            <li><a th:href="@{/about}">About Us</a></li>
            <li th:if="${session.user != null}"><a th:href="@{/buyProduct}">My Orders</a></li>
            <li th:if="${session.user != null}"><a th:href="@{/logout}">Log Out (<span th:text="${session.user.uname}"></span>)</a></li>
            <li th:if="${session.admin != null and session.user == null}"><a th:href="@{/admin/services}">Dashboard</a></li>
            <li th:if="${session.admin != null and session.user == null}"><a th:href="@{/logout}">Log Out</a></li>
            <li th:if="${session.user == null and session.admin == null}"><a th:href="@{/login}">Log In <i class="fa-solid fa-arrow-right-to-bracket"></i></a></li>
        </ul>
    </nav>
</body>
</html>
