<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodFrenzy - Register</title>
    <link rel="icon" type="image/x-icon" th:href="@{/Images/logo.png}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Navigation.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>
    <!-- Navigation Bar -->
    <nav th:replace="~{Navigation::navbar()}"></nav>

    <!-- Registration Container -->
    <div class="RegistrationContainer">
        <div class="registration-card">
            <div class="registration-header">
                <span class="badge">FoodFrenzy</span>
                <h2>Create an <span>Account</span></h2>
                <p>Sign up to explore the menu and order your favourite meals.</p>
            </div>

            <!-- Error Banner -->
            <div class="error-alert" th:if="${error}">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Registration Form -->
            <form th:action="@{/register}" method="post" th:object="${user}">
                <div class="form-group">
                    <label for="uname"><i class="fa-solid fa-user"></i> Full Name</label>
                    <input type="text" id="uname" name="uname" th:field="*{uname}" placeholder="Enter your full name" required autofocus>
                </div>

                <div class="form-group">
                    <label for="uemail"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <input type="email" id="uemail" name="uemail" th:field="*{uemail}" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="unumber"><i class="fa-solid fa-phone"></i> Phone Number</label>
                    <input type="tel" id="unumber" name="unumber" th:field="*{unumber}" pattern="[0-9]{10}" maxlength="10" placeholder="Enter 10-digit mobile number" title="Please enter a 10-digit mobile number" required>
                </div>

                <div class="form-group">
                    <label for="upassword"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="upassword" name="upassword" th:field="*{upassword}" minlength="4" maxlength="30" placeholder="Create password (min 4 characters)" required>
                </div>

                <button type="submit" class="register-btn">
                    <i class="fa-solid fa-user-plus"></i> Register
                </button>
            </form>

            <div class="login-footer">
                Already have an account? <a th:href="@{/login}">Log in here</a>
            </div>
        </div>
    </div>
</body>

</html>
