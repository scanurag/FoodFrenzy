<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Error - FoodFrenzy</title>
	<link rel="icon" type="image/x-icon" th:href="@{/Images/logo.png}">
	<style>
		.mainContainer {
			position: relative;
			top: 80px;
		}

		.container {
			width: 500px;
			font-family: cursive;
			font-weight: bold;
		}

		h1 {
			color: rgb(246, 160, 160);
		}

		a {
			position: relative;
			top: 30px;
			background-color: darkslategray;
			padding: 5px 15px;
			color: white;
			text-decoration: none;
			border-radius: 4px;
		}

		img {
			height: 200px;
		}
	</style>
</head>

<body>
	<center>
		<div class="mainContainer">
			<div class="image">
				<img th:src="@{/Images/repairImage.jpg}" alt="ErrorLogo" />
			</div>
			<div class="container">
				<h1>Ooops...Sorry..!!!</h1>
				<h3>Something went Wrong....!</h3>
				<small>An unexpected error has occurred.</small><br>
				<small style="color: red;">Please check your input or try again.</small>
				<br />
				<a th:href="@{/home}">Back to Home</a>
			</div>
		</div>
	</center>
</body>

</html>
